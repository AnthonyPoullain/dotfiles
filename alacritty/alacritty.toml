[cursor]
blink_interval = 500
thickness = 0.15
unfocused_hollow = true

[cursor.style]
blinking = "Never"
shape = "Block"

[font]
size = 13

[font.italic]
family = "VictorMono Nerd Font"

[font.normal]
family = "VictorMono Nerd Font"

[font.offset]
x = -1
y = 0

