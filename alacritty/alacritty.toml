[["key bindings"]]
action = "DecreaseFontSize"
key = "Equals"
mods = "Command"

[["key bindings"]]
action = "IncreaseFontSize"
key = "Slash"
mods = "Command"

[["key bindings"]]
action = "Quit"
key = "A"
mods = "Command"

[["key bindings"]]
action = "Quit"
key = "Z"
mods = "Command"

[["key bindings"]]
chars = "|"
key = "L"
mods = "Alt|Shift"

[["key bindings"]]
chars = "{"
key = "Key5"
mods = "Alt"

[["key bindings"]]
chars = "}"
key = "Minus"
mods = "Alt"

[["key bindings"]]
chars = "["
key = "Key5"
mods = "Alt|Shift"

[["key bindings"]]
chars = "]"
key = "Minus"
mods = "Alt|Shift"

[["key bindings"]]
chars = "~"
